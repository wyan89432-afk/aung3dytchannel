name: YouTube to Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-telegram
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check YouTube and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # @happydayfor works only if it is a public channel/group username
          # and the bot has permission to post there.
          TELEGRAM_CHAT_ID: "@happydayfor"
          YOUTUBE_HANDLE: "@aung3d"
        run: python youtube_to_telegram.py

      - name: Save sent video state
        run: |
          if git diff --quiet -- sent_videos.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_videos.json
          git commit -m "Update sent video state"
          git pull --rebase origin main
          git push origin HEAD:main
